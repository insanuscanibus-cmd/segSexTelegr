name: BTC Telegram Bot

on:
  schedule:
    # Roda a cada 30 minutos. O script só ENVIA mensagem quando cair na
    # janela de decisão de alguma estratégia (verifica sempre, alerta só quando faz sentido).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Rodar o bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/btc-bot.mjs

      - name: Salvar estado (janelas já alertadas)
        run: |
          git config user.name "btc-bot"
          git config user.email "btc-bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: atualizar estado do bot"
          git push
