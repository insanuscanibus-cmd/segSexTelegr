name: BTC Telegram Bot

on:
  schedule:
    # Roda a cada 30 minutos. Para 1x por hora, troque para: '0 * * * *'
    # Para 1x por dia, troque para: '0 12 * * *' (12h UTC = 9h BRT)
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions no GitHub

permissions:
  contents: write # necessário para o bot commitar o último preço de volta no repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar o bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/btc-bot.mjs

      - name: Salvar o preço mais recente no repositório
        run: |
          git config user.name "btc-bot"
          git config user.email "btc-bot@users.noreply.github.com"
          git add data/last-price.json
          git diff --staged --quiet || git commit -m "chore: atualizar último preço do BTC"
          git push
